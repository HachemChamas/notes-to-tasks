# Configuration for Alembic, the migration tool.
# Run Alembic commands from the backend/ folder, for example:
#     alembic upgrade head      apply every migration that hasn't run yet
#     alembic downgrade -1      undo the most recent migration
#     alembic history           list all migrations
#
# The database URL is NOT stored here (it contains a password).
# alembic/env.py reads it from DATABASE_URL instead.

[alembic]
# Folder that holds env.py and the versions/ folder with the migrations.
script_location = alembic
# Lets env.py import our `app` package.
prepend_sys_path = .

# The settings below only control what Alembic prints to the terminal.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
